<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Brief</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --fg:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --ok:#3fb950; --run:#d29922; --err:#f85149; --acc:#58a6ff; --acc2:#a371f7;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }

  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
           padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.02em; }
  header h1::before { content:"◆"; color:var(--acc); margin-right:7px; }
  #run { margin-left:auto; background:var(--acc); color:#0a1626; border:0; border-radius:6px;
         padding:8px 18px; font-weight:600; font-size:13px; cursor:pointer; }
  #run:disabled { opacity:.45; cursor:default; }
  .pills { display:flex; gap:7px; flex-wrap:wrap; }
  .pill { font-size:11px; padding:2px 9px; border-radius:99px; border:1px solid var(--line);
          color:var(--dim); white-space:nowrap; }
  .pill b { color:var(--fg); font-weight:600; }
  .pill.good { border-color:#1f6f34; color:var(--ok); }
  .pill.bad  { border-color:#7d2b28; color:var(--err); }

  /* stage rail */
  #stages { display:flex; gap:0; padding:16px 20px 4px; overflow-x:auto; }
  .stage { flex:1 1 0; min-width:120px; position:relative; padding:0 6px; }
  .stage:not(:last-child)::after { content:""; position:absolute; top:15px; right:-2px;
       width:calc(100% - 34px); height:2px; background:var(--line); }
  .stage.done:not(:last-child)::after { background:var(--ok); }
  .stage .bubble { width:30px; height:30px; border-radius:50%; border:2px solid var(--line);
       display:flex; align-items:center; justify-content:center; font-size:13px;
       background:var(--bg); color:var(--faint); position:relative; z-index:1; }
  .stage.done .bubble { border-color:var(--ok); color:var(--ok); }
  .stage.run  .bubble { border-color:var(--run); color:var(--run); animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .stage .name { margin-top:7px; font-size:12px; font-weight:600; color:var(--dim); }
  .stage.done .name, .stage.run .name { color:var(--fg); }
  .stage .sub { font-size:11px; color:var(--faint); min-height:15px; }

  main { display:grid; grid-template-columns:260px 1fr; gap:0;
         height:calc(100vh - 190px); }
  @media (max-width:820px){ main { grid-template-columns:1fr; height:auto; } }

  aside { border-right:1px solid var(--line); padding:16px; overflow:auto; }
  .funnel { display:flex; flex-direction:column; gap:2px; margin-bottom:20px; }
  .frow { display:flex; align-items:baseline; gap:8px; padding:5px 8px; border-radius:6px;
          background:var(--panel); }
  .frow .n { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; }
  .frow .l { font-size:12px; color:var(--dim); }
  .fgap { text-align:center; color:var(--faint); font-size:11px; line-height:1.2; }

  .nodes h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
              color:var(--faint); margin:14px 0 5px; }
  .node { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
          cursor:pointer; color:var(--dim); font-size:13px; }
  .node:hover { background:var(--panel); }
  .node.sel { background:var(--panel2); color:var(--fg); }
  .node .d { width:7px; height:7px; border-radius:50%; background:var(--line); flex:none; }
  .node.done .d { background:var(--ok); }
  .node.run  .d { background:var(--run); }
  .node.done { color:var(--fg); }

  section#stage-main { overflow:auto; padding:20px 24px; }

  /* brief */
  .brief { background:linear-gradient(180deg,var(--panel2),var(--panel));
           border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:18px; }
  .brief .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .brief h2 { font-size:22px; margin:0; letter-spacing:-.01em; }
  .brief .meta { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px;
           text-transform:uppercase; letter-spacing:.04em; }
  .badge.ok { background:#17351f; color:var(--ok); }
  .badge.partial { background:#3a2f12; color:var(--run); }
  .badge.failed { background:#3a1c1b; color:var(--err); }
  .sec { border-top:1px solid var(--line); padding:14px 0; }
  .sec:first-of-type { border-top:0; }
  .sec h4 { margin:0 0 8px; font-size:13px; font-weight:700; color:var(--fg);
            display:flex; align-items:center; gap:8px; }
  .sec h4 .ic { font-size:15px; }
  .sec ul { margin:0; padding-left:2px; list-style:none; display:flex; flex-direction:column; gap:7px; }
  .sec li { padding-left:18px; position:relative; color:var(--fg); }
  .sec li::before { content:"›"; position:absolute; left:2px; color:var(--acc); font-weight:700; }
  .sec ul.links li::before { content:"🔗"; font-size:11px; }
  .sec a { color:var(--acc); text-decoration:none; }
  .sec a:hover { text-decoration:underline; }
  .brief.skeleton { color:var(--dim); }
  .brief.skeleton h2 { color:var(--faint); }

  /* node detail */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--dim); font-weight:700; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:13px; }
  .kv dt { color:var(--dim); }
  .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  .list { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .li { display:flex; gap:9px; align-items:flex-start; font-size:13px; padding:6px 0;
        border-top:1px solid var(--line); }
  .li:first-child { border-top:0; }
  .src { font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; flex:none;
         background:var(--panel2); color:var(--dim); text-transform:uppercase; margin-top:2px; }
  .bar { height:5px; border-radius:3px; background:var(--acc); flex:none; align-self:center; }
  .muted { color:var(--faint); }
  .subh { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
          color:var(--dim); margin:12px 0 2px; }
  .fgap.link { cursor:pointer; }
  .fgap.link:hover { color:var(--acc); }
  pre { margin:8px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--dim);
        font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
        max-height:280px; overflow:auto; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; }

  /* log */
  #logwrap { border-top:1px solid var(--line); background:#0a0d11; }
  #logbar { display:flex; align-items:center; gap:10px; padding:6px 16px; cursor:pointer;
            font-size:12px; color:var(--dim); user-select:none; }
  #logbar .c { color:var(--faint); }
  #log { height:0; overflow:auto; transition:height .15s; padding:0 16px;
         font:11.5px/1.5 ui-monospace,Menlo,monospace; color:var(--dim); }
  #log.open { height:150px; padding:8px 16px; }
  #log .l { white-space:pre-wrap; }
  #log .l .t { color:var(--faint); }
  #log .l.err { color:var(--err); }
</style>
</head>
<body>
<header>
  <h1>Personal Brief</h1>
  <div class="pills" id="cfg"><span class="pill muted">not started</span></div>
  <button id="run">Run brief</button>
</header>

<div id="stages"></div>

<main>
  <aside>
    <div class="funnel" id="funnel"></div>
    <div class="nodes" id="nodes"></div>
  </aside>
  <section id="stage-main"></section>
</main>

<div id="logwrap">
  <div id="logbar"><span>▸ log</span><span class="c" id="logcount">0 lines</span></div>
  <div id="log"></div>
</div>

<script>
const $ = s => document.querySelector(s);

const STAGES = [
  { id:"memory",     name:"Memory",     glyph:"1", nodes:["load_memory"] },
  { id:"collect",    name:"Collect",    glyph:"2", nodes:["fetch_emails","fetch_events","fetch_news"] },
  { id:"filter",     name:"Filter",     glyph:"3", nodes:["normalize","rule_filter"] },
  { id:"prioritize", name:"Prioritize", glyph:"4", nodes:["pack_prioritize","prioritize"] },
  { id:"compose",    name:"Compose",    glyph:"5", nodes:["pack_compose","compose"] },
  { id:"save",       name:"Save",       glyph:"6", nodes:["persist"] },
];
const NODE_STAGE = {};
STAGES.forEach(s => s.nodes.forEach(n => NODE_STAGE[n] = s.id));

const SRC_ICON = { email:"📧", calendar:"📅", news:"📰" };
function sectionIcon(title) {
  const t = title.toLowerCase();
  if (/calendar|meeting|schedule|event/.test(t)) return "📅";
  if (/financ|money|payment|transfer|invoice|bank/.test(t)) return "💰";
  if (/security|alert|login|permission|account/.test(t)) return "🔒";
  if (/work|professional|client|project|team/.test(t)) return "💼";
  if (/news|industry|release|launch|ai\b/.test(t)) return "📰";
  if (/mail|inbox|message|reply/.test(t)) return "📧";
  if (/today|now|urgent|action/.test(t)) return "⏰";
  return "•";
}

let state = {};
function reset() {
  state = { deltas:{}, order:[], running:null, brief:null, selected:null, cfg:null, logs:0 };
}
reset();

/* ---------- stage rail ---------- */
function stageStatus(stg) {
  const done = stg.nodes.filter(n => state.deltas[n] !== undefined).length;
  if (done === stg.nodes.length && done > 0) return "done";
  if (done > 0 || stg.nodes.includes(state.running)) return "run";
  return "";
}
function renderStages() {
  $("#stages").innerHTML = STAGES.map(s => {
    const st = stageStatus(s);
    const done = s.nodes.filter(n => state.deltas[n] !== undefined).length;
    const sub = st === "done" ? "done"
              : st === "run" ? `${done}/${s.nodes.length}` : "";
    return `<div class="stage ${st}">
      <div class="bubble">${st === "done" ? "✓" : s.glyph}</div>
      <div class="name">${s.name}</div><div class="sub">${sub}</div></div>`;
  }).join("");
}

/* ---------- funnel ---------- */
function count(node, path) {
  const d = state.deltas[node]; if (!d) return null;
  return path(d);
}
function renderFunnel() {
  const em = count("fetch_emails", d => (d.source_results?.email?.items || []).length);
  const ev = count("fetch_events", d => (d.source_results?.calendar?.items || []).length);
  const nw = count("fetch_news",   d => (d.source_results?.news?.items || []).length);
  const norm = count("normalize", d => (d.items || []).length);
  const cand = count("rule_filter", d => (d.candidates || []).length);
  const rank = count("prioritize", d => (d.ranked || []).filter(r => r.include).length);
  const brf = state.brief ? state.brief.item_ids.length : null;
  const row = (n, l) => `<div class="frow"><span class="n">${n ?? "–"}</span><span class="l">${l}</span></div>`;
  const gap = (t, cls) => `<div class='fgap ${cls || ""}'>↓${t ? ` <span class="muted">${t}</span>` : ""}</div>`;
  const drop = (norm != null && cand != null) ? norm - cand : null;
  const rankDrop = (cand != null && rank != null) ? cand - rank : null;
  $("#funnel").innerHTML =
    row(em, "📧 emails") + row(ev, "📅 events") + row(nw, "📰 news") + gap() +
    row(norm, "collected") + gap(drop ? `−${drop} discarded by rules` : "", drop ? "link" : "") +
    row(cand, "🔎 candidates") + gap(rankDrop ? `−${rankDrop} set aside by model` : "", rankDrop ? "link2" : "") +
    row(rank, "★ ranked in") + gap() +
    row(brf, "✨ in brief");
  const j = $("#funnel").querySelector(".link");
  if (j) j.onclick = () => { state.selected = "rule_filter"; renderNodes(); renderMain(); };
  const j2 = $("#funnel").querySelector(".link2");
  if (j2) j2.onclick = () => { state.selected = "prioritize"; renderNodes(); renderMain(); };
}

/* ---------- node list ---------- */
function renderNodes() {
  $("#nodes").innerHTML = STAGES.map(s => {
    const items = s.nodes.map(n => {
      const cls = state.deltas[n] !== undefined ? "done"
                : n === state.running ? "run" : "";
      const sel = n === state.selected ? "sel" : "";
      return `<div class="node ${cls} ${sel}" data-n="${n}">
        <span class="d"></span><span>${n}</span></div>`;
    }).join("");
    return `<h3>${s.name}</h3>${items}`;
  }).join("");
  $("#nodes").querySelectorAll(".node").forEach(el =>
    el.onclick = () => { state.selected = el.dataset.n; renderNodes(); renderMain(); });
}

/* ---------- main: brief + node detail ---------- */
function briefCard() {
  const b = state.brief;
  if (!b) {
    const composing = state.deltas.pack_compose !== undefined;
    return `<div class="brief skeleton"><div class="top"><h2>${composing ? "Composing…" : "No brief yet"}</h2></div>
      <div class="meta">${composing ? "the model is writing your brief" : "run the pipeline to generate today’s brief"}</div></div>`;
  }
  const when = new Date(b.generated_at).toLocaleString(undefined,
    { weekday:"long", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
  const secs = (b.sections || []).map(s => `
    <div class="sec"><h4><span class="ic">${sectionIcon(s.title)}</span>${escapeHtml(s.title)}</h4>
      <ul>${(s.bullets || []).map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul></div>`).join("");
  const links = (b.links || []).length ? `
    <div class="sec"><h4><span class="ic">🔗</span>Sources</h4>
      <ul class="links">${b.links.map(l =>
        `<li><a href="${encodeURI(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.title)}</a></li>`
      ).join("")}</ul></div>` : "";
  return `<div class="brief">
    <div class="top"><h2>${escapeHtml(b.headline)}</h2>
      <span class="badge ${b.status}">${b.status}</span></div>
    <div class="meta">${when} · ${b.item_ids.length} item${b.item_ids.length === 1 ? "" : "s"} · ${escapeHtml(b.model)}</div>
    ${secs}${links}</div>`;
}

function itemLine(i) {
  return `<div class="li"><span class="src">${SRC_ICON[i.source] || ""} ${i.source}</span>
    <span>${escapeHtml(i.title)}${i.url ? ` <a href="${encodeURI(i.url)}" target="_blank" class="muted">↗</a>` : ""}</span></div>`;
}

function nodeDetail(n) {
  const d = state.deltas[n];
  if (d === undefined) return "";
  let body = "";
  const sr = d.source_results || {};
  const srcKey = Object.keys(sr)[0];
  if (srcKey) {
    const items = sr[srcKey].items || [];
    body = `<dl class="kv"><dt>source</dt><dd>${srcKey}</dd><dt>ok</dt><dd>${sr[srcKey].ok}</dd>
      <dt>items</dt><dd>${items.length}</dd></dl>
      <div class="list">${items.map(itemLine).join("") || "<span class='muted'>none</span>"}</div>`;
  } else if (d.memory_view) {
    const m = d.memory_view;
    body = `<dl class="kv">
      <dt>profile</dt><dd>${escapeHtml(m.profile || "—")}</dd>
      <dt>max items</dt><dd>${m.policy?.max_items}</dd>
      <dt>open loops</dt><dd>${(m.open_loops || []).length}</dd>
      <dt>seen ids</dt><dd>${(m.seen_ids || []).length}</dd>
      <dt>last brief</dt><dd>${escapeHtml((m.last_brief_digest?.headlines || [])[0] || "—")}</dd></dl>`;
  } else if (d.items) {
    body = `<div class="kv"><dt>normalized</dt><dd>${d.items.length}</dd></div>
      <div class="list">${d.items.map(itemLine).join("")}</div>`;
  } else if (d.candidates) {
    const disc = d.discarded || [];
    const groups = {};
    disc.forEach(x => (groups[x.reason] = groups[x.reason] || []).push(x));
    const discHtml = Object.entries(groups).map(([reason, xs]) => `
      <div class="subh">✕ ${escapeHtml(reason)} · ${xs.length}</div>
      ${xs.map(x => `<div class="li muted"><span class="src">${SRC_ICON[x.source] || ""} ${x.source}</span>
        <span>${escapeHtml(x.title)}${x.url ? ` <a href="${encodeURI(x.url)}" target="_blank">↗</a>` : ""}</span></div>`).join("")}`).join("");
    body = `<div class="kv"><dt>kept</dt><dd>${d.candidates.length}</dd>
        <dt>discarded</dt><dd>${disc.length}</dd></div>
      <div class="subh">✓ kept · ${d.candidates.length}</div>
      <div class="list">${d.candidates.map(itemLine).join("")}</div>
      ${discHtml ? `<div class="list">${discHtml}</div>` : ""}`;
  } else if (d.prioritize_pack) {
    body = `<div class="kv"><dt>cards to model</dt><dd>${d.prioritize_pack.length}</dd></div>`;
  } else if (d.ranked) {
    const row = r => `
      <div class="li ${r.include ? "" : "muted"}"><span class="src">${r.include ? "★" : "✕"} ${r.score.toFixed(2)}</span>
        <span><span class="bar" style="width:${Math.round(r.score*90)}px"></span><br>
        <span class="muted">${escapeHtml(r.item_id)}</span><br>${escapeHtml(r.reason)}</span></div>`;
    const sorted = d.ranked.slice().sort((a,b) => a.rank - b.rank);
    const keep = sorted.filter(r => r.include), drop = sorted.filter(r => !r.include);
    body = `<div class="kv"><dt>ranked by model</dt><dd>${d.ranked.length}</dd>
        <dt>kept for brief</dt><dd>${keep.length}</dd>
        <dt>set aside</dt><dd>${drop.length}</dd></div>
      <div class="subh">★ kept for brief</div>
      <div class="list">${keep.map(row).join("") || "<span class='muted'>none</span>"}</div>
      ${drop.length ? `<div class="subh">✕ set aside by model</div>
        <div class="list">${drop.map(row).join("")}</div>` : ""}`;
  } else if (d.compose_pack) {
    const p = d.compose_pack;
    body = `<dl class="kv"><dt>winners</dt><dd>${(p.winners || []).length}</dd>
      <dt>open loops</dt><dd>${(p.open_loops || []).length}</dd>
      <dt>yesterday</dt><dd>${(p.last_headlines || []).length} headline(s)</dd></dl>`;
  } else if ("brief" in d) {
    body = `<span class="muted">brief written — see above</span>`;
  } else {
    body = `<span class="muted">persisted to store + data/memory.json</span>`;
  }
  return `<div class="card"><h3>${n}</h3>${body}
    <details><summary>raw delta</summary><pre>${escapeHtml(JSON.stringify(d, null, 2))}</pre></details></div>`;
}

function renderMain() {
  const sel = state.selected;
  $("#stage-main").innerHTML = briefCard() + (sel ? nodeDetail(sel) : "");
}

/* ---------- misc ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
function addLog(msg, err) {
  const now = new Date().toLocaleTimeString();
  const d = document.createElement("div");
  d.className = "l" + (err ? " err" : "");
  d.innerHTML = `<span class="t">${now}</span>  ${escapeHtml(msg)}`;
  $("#log").appendChild(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  state.logs++; $("#logcount").textContent = state.logs + " lines";
}
$("#logbar").onclick = () => {
  const l = $("#log"); l.classList.toggle("open");
  $("#logbar").firstChild.textContent = l.classList.contains("open") ? "▾ log" : "▸ log";
};

function renderCfg() {
  const c = state.cfg;
  if (!c) return;
  $("#cfg").innerHTML =
    `<span class="pill"><b>LLM</b> ${escapeHtml(c.llm.replace(/^GrokLLM /,""))}</span>` +
    `<span class="pill ${c.xai_api_key ? "good" : "bad"}">key ${c.xai_api_key ? "set" : "missing"}</span>` +
    `<span class="pill ${c.google_token ? "good" : "bad"}">Google ${c.google_token ? "connected" : "off"}</span>`;
}

let es = null;
$("#run").onclick = () => {
  if (es) es.close();
  reset();
  $("#log").innerHTML = ""; $("#logcount").textContent = "0 lines";
  $("#run").disabled = true;
  renderStages(); renderFunnel(); renderNodes(); renderMain();
  es = new EventSource("/api/run");

  es.addEventListener("config", e => {
    const c = JSON.parse(e.data);
    state.cfg = c; state.order = c.nodes;
    state.running = c.nodes[0];
    renderCfg(); renderStages(); renderNodes();
    addLog("config · " + c.llm);
  });
  es.addEventListener("step", e => {
    const { node, delta } = JSON.parse(e.data);
    state.deltas[node] = delta || {};
    if (delta && delta.brief) state.brief = delta.brief;
    const i = state.order.indexOf(node);
    state.running = state.order[i + 1] || null;
    if (!state.selected || NODE_STAGE[state.selected] === NODE_STAGE[node]) state.selected = node;
    renderStages(); renderFunnel(); renderNodes(); renderMain();
  });
  es.addEventListener("log", e => addLog(JSON.parse(e.data)));
  es.addEventListener("error", e => {
    let m = "stream error"; try { m = JSON.parse(e.data).message; } catch {}
    addLog(m, true); $("#log").classList.add("open");
  });
  es.addEventListener("done", () => finish("done"));
  // native connection drop: close so EventSource does NOT auto-reconnect
  // (each reconnect would start a new graph run and spend credits)
  es.onerror = () => { if (es && es.readyState === 2) finish("connection closed", true); };
};

function finish(msg, err) {
  state.running = null;
  $("#run").disabled = false;
  if (es) { es.close(); es = null; }
  renderStages(); renderNodes();
  addLog(msg, err);
};
</script>
</body>
</html>
