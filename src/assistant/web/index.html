<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donna</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,500;1,400;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --blush-100:#FCF4EE; --blush-200:#F8EDE4; --blush-300:#EFDBCC;
    --sand:#E3AB95; --coral-400:#DA8E71; --coral:#D17252;
    --coral-600:#B85C3F; --coral-700:#9A4A31;
    --ink:#2E2622; --muted:#8C7B71; --paper:#FFFDFB;
    --ok:#5C8A5A; --pending:#DED4CB;
    --serif:"Libre Bodoni",Georgia,"Times New Roman",serif;
    --sans:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--blush-100); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased; }
  a { color:var(--coral-700); }

  .page { max-width:680px; margin:0 auto; padding:0 24px 120px; }

  /* header */
  header { display:flex; align-items:center; gap:16px; padding:26px 0 22px; }
  .wordmark { font-family:var(--serif); font-size:30px; font-weight:500; line-height:1; }
  .wordmark .dot { color:var(--coral); }
  .spacer { flex:1; }
  #status { width:9px; height:9px; border-radius:50%; background:var(--pending); cursor:help;
            position:relative; }
  #status.live { background:var(--ok); }
  #status:hover .status-pop { display:block; }
  .status-pop { display:none; position:absolute; right:0; top:18px; background:var(--paper);
                border:1px solid var(--blush-300); border-radius:8px; padding:10px 12px;
                width:230px; font-size:12px; color:var(--muted); z-index:5; line-height:1.5; }
  button#run { font-family:var(--sans); font-weight:700; font-size:12px; letter-spacing:.1em;
               text-transform:uppercase; color:var(--paper); background:var(--coral);
               border:0; border-radius:7px; padding:11px 20px; cursor:pointer; }
  button#run:hover { background:var(--coral-600); }
  button#run:disabled { background:var(--pending); color:var(--muted); cursor:default; }

  /* greeting */
  .greeting { font-family:var(--serif); font-size:30px; font-weight:400; line-height:1.3;
              margin:14px 0 4px; }
  .date { color:var(--muted); font-size:13px; letter-spacing:.02em; margin-bottom:34px; }

  .empty { font-family:var(--serif); font-style:italic; color:var(--muted); font-size:18px;
           padding:30px 0 50px; }

  /* groups */
  .grp { margin-bottom:34px; }
  .eyebrow { font:700 11px/1 var(--sans); letter-spacing:.2em; text-transform:uppercase;
             color:var(--coral-600); display:flex; align-items:center; gap:14px; margin:0 0 16px; }
  .eyebrow::after { content:""; height:1px; background:var(--coral-600); opacity:.4; flex:1; }
  .grp ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .grp li { padding-left:18px; position:relative; }
  .grp li::before { content:""; position:absolute; left:0; top:.62em; width:6px; height:6px;
                    border-radius:50%; background:var(--sand); }
  .grp.needs li::before { background:var(--coral); width:7px; height:7px; }
  .grp li a.lnk { display:block; font-size:13px; margin-top:3px; text-decoration:none; }
  .grp li a.lnk::before { content:"\2197  "; color:var(--coral); }
  .grp li a.lnk:hover { text-decoration:underline; }

  .signoff { font-family:var(--serif); font-style:italic; color:var(--muted); font-size:17px;
             margin:8px 0 0; }

  /* pipeline */
  .rule { height:1px; background:var(--blush-300); margin:44px 0 30px; }
  .stepper { display:flex; margin:22px 0 6px; }
  .stage { flex:1; text-align:center; position:relative; cursor:pointer; padding-top:4px; }
  .stage::before { content:""; position:absolute; top:15px; left:-50%; width:100%; height:2px;
                   background:var(--pending); z-index:0; }
  .stage:first-child::before { display:none; }
  .stage.done::before, .stage.run::before { background:var(--coral-400); }
  .bubble { position:relative; z-index:1; width:30px; height:30px; border-radius:50%; margin:0 auto;
            display:flex; align-items:center; justify-content:center; font:600 12px var(--sans);
            background:var(--blush-100); border:2px solid var(--pending); color:var(--muted); }
  .stage.done .bubble { border-color:var(--ok); color:var(--ok); }
  .stage.run  .bubble { border-color:var(--coral); color:var(--coral); animation:pulse 1.1s infinite; }
  .stage.sel  .bubble { border-color:var(--coral-700); }
  @keyframes pulse { 50% { opacity:.4; } }
  .stage .nm { font:600 11px var(--sans); margin-top:8px; color:var(--muted);
               letter-spacing:.04em; text-transform:uppercase; }
  .stage.done .nm, .stage.run .nm { color:var(--ink); }
  .stage .stat { font-size:11px; color:var(--sand); min-height:15px; margin-top:2px; }

  .inspector { background:var(--paper); border:1px solid var(--blush-300); border-radius:12px;
               padding:20px 22px; margin-top:22px; display:none; }
  .insp-node { margin-bottom:18px; }
  .insp-node:last-child { margin-bottom:0; }
  .insp-node h4 { font:700 10px var(--sans); letter-spacing:.12em; text-transform:uppercase;
                  color:var(--coral-600); margin:0 0 4px; }
  .insp-node .blurb { font-family:var(--serif); font-style:italic; color:var(--muted);
                      font-size:14px; margin:0 0 10px; }
  .kv { display:flex; gap:22px; flex-wrap:wrap; margin:6px 0 10px; }
  .kv div { font-size:11px; color:var(--muted); }
  .kv b { display:block; font:700 18px/1.1 var(--serif); color:var(--ink); }
  .subh { font:700 10px var(--sans); letter-spacing:.1em; text-transform:uppercase;
          color:var(--coral-600); margin:12px 0 5px; }
  .r { display:flex; gap:9px; padding:5px 0; border-top:1px solid var(--blush-200); font-size:13px; }
  .r:first-of-type { border-top:0; }
  .r.dim { color:var(--muted); }
  .st { font:700 9px var(--sans); text-transform:uppercase; letter-spacing:.05em; flex:none;
        padding:2px 6px; border-radius:4px; background:var(--blush-200); color:var(--muted);
        height:fit-content; margin-top:1px; }
  .score { font-variant-numeric:tabular-nums; font-weight:700; color:var(--coral-700); flex:none; }
  details.raw, details.src { margin-top:12px; }
  details.raw summary, details.src summary { font:600 10px var(--sans); letter-spacing:.1em;
      text-transform:uppercase; color:var(--coral-600); cursor:pointer; }
  details.raw pre, details.src pre { margin:8px 0 0; padding:11px; background:var(--blush-100);
      border:1px solid var(--blush-300); border-radius:8px; overflow:auto; max-height:260px;
      font:11px/1.5 ui-monospace,Menlo,monospace; color:var(--muted); white-space:pre; }

  #logwrap { position:fixed; left:0; right:0; bottom:0; background:var(--blush-200);
             border-top:1px solid var(--blush-300); }
  #logbar { max-width:680px; margin:0 auto; padding:7px 24px; font:600 11px var(--sans);
            letter-spacing:.05em; color:var(--muted); cursor:pointer; display:flex; gap:12px; }
  #log { max-width:680px; margin:0 auto; height:0; overflow:auto; padding:0 24px;
         font:11.5px/1.6 ui-monospace,Menlo,monospace; color:var(--muted); transition:height .15s; }
  #log.open { height:150px; padding:10px 24px; }
  #log .l .t { color:var(--sand); }
  #log .l.err { color:#b3402c; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="wordmark">Donna<span class="dot">.</span></div>
    <div class="spacer"></div>
    <div id="status">·<div class="status-pop" id="statuspop">not started</div></div>
    <button id="run">Run brief</button>
  </header>

  <div id="brief">
    <div class="empty">Nothing yet. Press <b>Run&nbsp;brief</b> and I’ll pull one together.</div>
  </div>

  <div class="rule"></div>
  <div class="eyebrow">How I put this together</div>
  <div class="stepper" id="stepper"></div>
  <div class="inspector" id="inspector"></div>
  <details class="src"><summary>LangGraph source</summary><pre id="mermaid"></pre></details>
</div>

<div id="logwrap">
  <div id="logbar"><span id="logtoggle">▸ log</span><span id="logcount"></span></div>
  <div id="log"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const SRC = { email:"inbox", calendar:"calendar", news:"news" };

const STAGES = [
  { id:"memory", name:"Memory", nodes:["load_memory"] },
  { id:"collect", name:"Collect", nodes:["fetch_emails","fetch_events","fetch_news"] },
  { id:"filter", name:"Filter", nodes:["normalize","rule_filter"] },
  { id:"prioritize", name:"Prioritize", nodes:["pack_prioritize","prioritize"] },
  { id:"compose", name:"Compose", nodes:["pack_compose","compose"] },
  { id:"save", name:"Save", nodes:["persist"] },
];
const NODE_ORDER = STAGES.flatMap(s => s.nodes);

let G = null;
let S = { d:{}, running:null, brief:null, sel:null, logs:0 };

/* ---------- pipeline ---------- */
function stageState(st) {
  const done = st.nodes.filter(n => S.d[n] !== undefined).length;
  if (done === st.nodes.length && done) return "done";
  if (done || st.nodes.includes(S.running)) return "run";
  return "";
}
function stageStat(st) {
  const d = S.d;
  if (st.id === "memory" && d.load_memory) return (d.load_memory.memory_view.seen_ids || []).length + " seen";
  if (st.id === "collect") {
    const c = ["fetch_emails","fetch_events","fetch_news"]
      .reduce((a,n) => a + (d[n] ? (Object.values(d[n].source_results || {})[0]?.items || []).length : 0), 0);
    return d.fetch_news ? c + " gathered" : "";
  }
  if (st.id === "filter" && d.rule_filter)
    return `${(d.rule_filter.candidates || []).length} kept · ${(d.rule_filter.discarded || []).length} out`;
  if (st.id === "prioritize" && d.prioritize)
    return (d.prioritize.ranked || []).filter(r => r.include).length + " chosen";
  if (st.id === "compose" && S.brief) return S.brief.item_ids.length + " items";
  if (st.id === "save" && d.persist !== undefined) return "saved";
  return "";
}
function renderStepper() {
  $("#stepper").innerHTML = STAGES.map(st => {
    const state = stageState(st);
    const sel = st.id === S.sel ? "sel" : "";
    return `<div class="stage ${state} ${sel}" data-s="${st.id}">
      <div class="bubble">${state === "done" ? "✓" : STAGES.indexOf(st) + 1}</div>
      <div class="nm">${st.name}</div><div class="stat">${stageStat(st)}</div></div>`;
  }).join("");
  $("#stepper").querySelectorAll(".stage").forEach(el =>
    el.onclick = () => { S.sel = el.dataset.s; renderStepper(); renderInspector(); });
}

/* ---------- inspector ---------- */
function stat(n, l) { return `<div><b>${n ?? "–"}</b>${l}</div>`; }
function itemRows(items) {
  return (items || []).map(i => `<div class="r"><span class="st">${SRC[i.source] || i.source}</span>
    <span>${esc(i.title)}${i.url ? ` <a href="${encodeURI(i.url)}" target="_blank">↗</a>` : ""}</span></div>`).join("");
}
function nodeBlock(n) {
  const d = S.d[n];
  let b = `<div class="insp-node"><h4>${n}</h4>`;
  if (d === undefined) return b + `<div class="r dim">hasn’t run yet</div></div>`;
  const sr = d.source_results || {}, k = Object.keys(sr)[0];
  if (k) {
    const items = sr[k].items || [];
    b += `<div class="kv">${stat(items.length, "fetched")}</div>` + (itemRows(items) || `<div class="r dim">none</div>`);
  } else if (d.memory_view) {
    const m = d.memory_view;
    b += `<div class="kv">${stat(m.policy?.max_items, "brief size")}${stat((m.open_loops || []).length, "open loops")}${stat((m.seen_ids || []).length, "already seen")}</div>`;
  } else if (d.discarded !== undefined) {
    b += `<div class="kv">${stat((d.candidates || []).length, "kept")}${stat((d.discarded || []).length, "discarded")}</div>`;
    b += `<div class="subh">kept</div>` + itemRows(d.candidates);
    const g = {}; (d.discarded || []).forEach(x => (g[x.reason] = g[x.reason] || []).push(x));
    Object.entries(g).forEach(([r, xs]) => {
      b += `<div class="subh">✕ ${esc(r)}</div>` + xs.map(x =>
        `<div class="r dim"><span class="st">${SRC[x.source] || x.source}</span><span>${esc(x.title)}</span></div>`).join("");
    });
  } else if (d.ranked) {
    const sorted = d.ranked.slice().sort((a, b) => a.rank - b.rank);
    const keep = sorted.filter(r => r.include), drop = sorted.filter(r => !r.include);
    b += `<div class="kv">${stat(keep.length, "chosen")}${stat(drop.length, "set aside")}</div>`;
    const rr = r => `<div class="r ${r.include ? "" : "dim"}"><span class="score">${r.score.toFixed(2)}</span>
      <span>${esc(r.item_id)}<br><span style="color:var(--muted)">${esc(r.reason)}</span></span></div>`;
    b += `<div class="subh">chosen</div>` + (keep.map(rr).join("") || `<div class="r dim">none</div>`);
    if (drop.length) b += `<div class="subh">set aside by me</div>` + drop.map(rr).join("");
  } else if (d.items) {
    b += `<div class="kv">${stat(d.items.length, "merged")}</div>` + itemRows(d.items);
  } else if (d.prioritize_pack) {
    b += `<div class="kv">${stat(d.prioritize_pack.length, "cards to the model")}</div>
      <div class="r dim">only the title, source, time and signals go to the model, never the body</div>`;
  } else if (d.compose_pack) {
    const p = d.compose_pack;
    b += `<div class="kv">${stat((p.winners || []).length, "winners")}${stat((p.links || []).length, "links")}</div>`;
  } else if ("brief" in d) {
    b += `<div class="r">brief written, shown above</div>`;
  } else {
    b += `<div class="r">saved to the store, items added to the seen list</div>`;
  }
  b += `<details class="raw"><summary>raw delta</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details>`;
  return b + `</div>`;
}
function renderInspector() {
  const box = $("#inspector");
  const st = STAGES.find(s => s.id === S.sel);
  if (!st) { box.style.display = "none"; return; }
  const blurb = (G && G.stages || []).find(s => s.id === st.id)?.blurb || "";
  box.innerHTML = (blurb ? `<p class="insp-node blurb" style="margin-top:0">${esc(blurb)}</p>` : "")
    + st.nodes.map(nodeBlock).join("");
  box.style.display = "block";
}

/* ---------- brief ---------- */
function matchLinks(sections, links) {
  const used = new Set(), buckets = sections.map(() => []);
  (links || []).forEach(l => {
    const w = new Set((l.title.toLowerCase().match(/[a-z0-9]{4,}/g) || []));
    let best = -1, bs = 1;
    sections.forEach((s, i) => {
      const hay = (s.title + " " + s.bullets.join(" ")).toLowerCase();
      let sc = 0; w.forEach(x => { if (hay.includes(x)) sc++; });
      if (sc > bs) { bs = sc; best = i; }
    });
    if (best >= 0) { buckets[best].push(l); used.add(l); }
  });
  return { buckets, leftover: (links || []).filter(l => !used.has(l)) };
}
const GRP_CLASS = { "Needs you":"needs", "Good to know":"know", "In AI news":"news" };
function renderBrief() {
  const b = S.brief;
  if (!b) {
    if (S.running) $("#brief").innerHTML = `<div class="empty">Working on it…</div>`;
    return;
  }
  const when = new Date(b.generated_at).toLocaleDateString(undefined,
    { weekday:"long", month:"long", day:"numeric" });
  const { buckets, leftover } = matchLinks(b.sections || [], b.links);
  const grps = (b.sections || []).map((s, i) => {
    const links = buckets[i].map(l =>
      `<a class="lnk" href="${encodeURI(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join("");
    const items = (s.bullets || []).map((x, j) =>
      `<li>${esc(x)}${j === s.bullets.length - 1 ? links : ""}</li>`).join("");
    return `<div class="grp ${GRP_CLASS[s.title] || ""}">
      <div class="eyebrow">${esc(s.title)}</div><ul>${items}</ul></div>`;
  }).join("");
  const extra = leftover.length ? `<div class="grp"><div class="eyebrow">More</div><ul>${
    leftover.map(l => `<li><a class="lnk" href="${encodeURI(l.url)}" target="_blank">${esc(l.title)}</a></li>`).join("")
  }</ul></div>` : "";
  $("#brief").innerHTML =
    `<div class="greeting">${esc(b.headline)}</div>
     <div class="date">${when}</div>
     ${grps}${extra}
     ${b.signoff ? `<p class="signoff">${esc(b.signoff)}</p>` : ""}`;
}

/* ---------- log ---------- */
function addLog(msg, err) {
  const d = document.createElement("div");
  d.className = "l" + (err ? " err" : "");
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span>  ${esc(msg)}`;
  $("#log").appendChild(d); $("#log").scrollTop = 1e9;
  S.logs++; $("#logcount").textContent = S.logs + " lines";
}
$("#logbar").onclick = () => {
  const l = $("#log"); l.classList.toggle("open");
  $("#logtoggle").textContent = l.classList.contains("open") ? "▾ log" : "▸ log";
};

/* ---------- run ---------- */
let es = null;
async function loadGraph() {
  try {
    G = await (await fetch("/api/graph")).json();
    $("#mermaid").textContent = G.mermaid;
    renderStepper();
  } catch (e) { addLog("could not load graph: " + e, true); }
}
function finish(msg, err) {
  S.running = null; $("#run").disabled = false;
  if (es) { es.close(); es = null; }
  renderStepper(); addLog(msg, err);
}
$("#run").onclick = () => {
  if (es) es.close();
  S = { d:{}, running:NODE_ORDER[0], brief:null, sel:null, logs:0 };
  $("#log").innerHTML = ""; $("#logcount").textContent = "";
  $("#brief").innerHTML = `<div class="empty">Working on it…</div>`;
  $("#inspector").style.display = "none";
  $("#run").disabled = true;
  renderStepper();
  es = new EventSource("/api/run");

  es.addEventListener("config", e => {
    const c = JSON.parse(e.data);
    $("#status").classList.toggle("live", c.xai_api_key);
    $("#statuspop").innerHTML =
      `${esc(c.llm)}<br>API key ${c.xai_api_key ? "set" : "missing"}<br>Google ${c.google_token ? "connected" : "off"}`;
    addLog("config · " + c.llm);
  });
  es.addEventListener("step", e => {
    const { node, delta } = JSON.parse(e.data);
    S.d[node] = delta || {};
    if (delta && delta.brief) S.brief = delta.brief;
    const i = NODE_ORDER.indexOf(node);
    S.running = NODE_ORDER[i + 1] || null;
    if (S.sel) renderInspector();
    renderStepper(); renderBrief();
  });
  es.addEventListener("log", e => addLog(JSON.parse(e.data)));
  es.addEventListener("error", e => {
    let m = "stream error"; try { m = JSON.parse(e.data).message; } catch {}
    addLog(m, true); $("#log").classList.add("open");
  });
  es.addEventListener("done", () => { renderBrief(); finish("done"); });
  es.onerror = () => { if (es && es.readyState === 2) finish("connection closed", true); };
};

loadGraph();
</script>
</body>
</html>
